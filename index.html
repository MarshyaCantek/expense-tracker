<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Tracker.io</title>

    <!-- GOOGLE FONT -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="tracker-app">

      <!-- HEADER -->
      <header class="tracker-header">

        <h1 class="tracker-logo">
          Tracker<span>.io</span>
        </h1>

        <!-- PROFILE -->
        <div class="tracker-profile">

          <div class="tracker-profile__text">
            <p>👤 Halo, <strong>Marshya Salsabilla</strong></p>
            <span>Bulan ini</span>
          </div>

          <!-- FOTO PROFILE -->
          <label class="tracker-profile__avatar">

            <input type="file" id="profileInput" accept="image/*" hidden />

            <img
              id="profilePreview"
              src="https://i.pravatar.cc/100"
              alt="Profile"
            />

          </label>

        </div>

      </header>

      <!-- SUMMARY -->
      <section class="tracker-summary">

        <div class="summary-card">
          <p>Saldo Saat Ini</p>
          <h2 id="balance">Rp 0</h2>
        </div>

        <div class="summary-card">
          <p>Pemasukan</p>
          <h2 class="income" id="income">Rp 0</h2>
        </div>

        <div class="summary-card">
          <p>Pengeluaran</p>
          <h2 class="expense" id="expense">Rp 0</h2>
        </div>

      </section>

      <!-- FORM -->
      <section class="tracker-form-card">

        <div class="tracker-form-title">

          <div class="icon-box">+</div>

          <h2>Tambah Pencatatan Baru</h2>

        </div>

        <form id="transactionForm" class="tracker-form">

          <div class="form-group">
            <label>Keterangan</label>

            <input
              type="text"
              id="title"
              placeholder="Misal: Makan siang..."
              required
            />
          </div>

          <div class="form-group">
            <label>Nominal (Rp)</label>

            <input
              type="number"
              id="amount"
              placeholder="50000"
              required
            />
          </div>

          <div class="form-group">
            <label>Tanggal</label>

            <input
              type="date"
              id="date"
              required
            />
          </div>

          <div class="form-group">
            <label>Klasifikasi</label>

            <select id="type">

              <option value="income">
                Uang Masuk (+)
              </option>

              <option value="expense">
                Uang Keluar (-)
              </option>

            </select>
          </div>

          <button type="submit">
            Simpan
          </button>

        </form>

      </section>

      <!-- SEARCH -->
      <section class="tracker-search-card">

        <input
          type="text"
          placeholder="Cari transaksi berdasarkan judul..."
        />

        <button>Cari</button>

      </section>

    </div>

    <!-- JS -->
    <script src="script.js"></script>
  </body>
</html>
